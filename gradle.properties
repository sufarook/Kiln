android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.mpp.androidSourceSetLayoutV2AndroidStyleDirs.nowarn=true
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
# KSP incremental processing can produce stale state after `clean` when combined with
# the Gradle local build cache. Disabling it ensures a full regeneration on every build.
ksp.incremental=false
# Dokka 2.x's new Gradle plugin model (the dokka {} DSL, dependencies { dokka(...) }
# aggregation) — the 1.x task-based config is deprecated.
org.jetbrains.dokka.experimental.gradle.pluginMode=V2Enabled
