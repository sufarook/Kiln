name: CI

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  processor-tests:
    name: Processor Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml') }}
      - run: ./gradlew :processor:test --no-daemon
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: processor-test-results
          path: processor/build/reports/tests/

  runtime-tests:
    name: Runtime JVM Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml') }}
      - run: ./gradlew :runtime:jvmTest --no-daemon
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: runtime-test-results
          path: runtime/build/reports/tests/jvmTest/

  gradle-plugin-tests:
    name: Gradle Plugin Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml') }}
      - run: ./gradlew :gradle-plugin:test --no-daemon
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: gradle-plugin-test-results
          path: gradle-plugin/build/reports/tests/

  runtime-ios-tests:
    name: Runtime iOS Simulator Tests
    # SchemaMigrator/QueryDsl/Transaction now run as commonTest, so this executes
    # the exact same suite as runtime-tests, but against the Kotlin/Native driver
    # on a real simulator — GitHub's macos-latest runners are Apple Silicon, which
    # is why iosSimulatorArm64Test (not iosX64Test) is the one that runs here.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-macos-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml') }}
      - run: ./gradlew :runtime:iosSimulatorArm64Test --no-daemon
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: runtime-ios-test-results
          path: runtime/build/test-results/iosSimulatorArm64Test/

  consumer-smoke:
    name: Consumer Smoke Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml') }}

      # Publish the exact artifacts a release would push, then consume them the way
      # a real user does — through the plugin, resolved from a repository.
      - name: Publish to Maven Local
        run: ./gradlew publishToMavenLocal --no-daemon

      - name: Resolve project version
        id: version
        run: echo "value=$(./gradlew -q printVersion --no-daemon)" >> "$GITHUB_OUTPUT"

      - name: Build consumer project against published artifacts
        run: >-
          ./gradlew -p integration-tests/consumer-smoke test --no-daemon
          -PkilnVersion=${{ steps.version.outputs.value }}

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: consumer-smoke-results
          path: integration-tests/consumer-smoke/build/reports/tests/test/

  android-integration:
    name: Android Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          script: ./gradlew :sample-android:connectedAndroidTest --no-daemon
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: android-test-results
          path: sample-android/build/reports/androidTests/

  publish:
    name: Publish to Maven Central
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [processor-tests, runtime-tests, runtime-ios-tests, gradle-plugin-tests, consumer-smoke, android-integration]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml') }}
      - run: ./gradlew publishAllPublicationsToMavenCentralRepository --no-daemon
        env:
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
